<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RISC-V single-cycle CPU — interactive schematic</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#16181d; --muted:#5d6470; --line:#d9dde3;
  --wire:#6b7280; --ctrl:#1f6fd1; --clk:#9aa1ab; --on:#e0532b; --onctrl:#1f6fd1;
  --blk:#ffffff; --blkline:#2a2f38;
  --g-DataPath:#e7f0fd; --g-controlblock:#efe8fb; --g-core:#e4f5f0; --g-cpu:#fdf0e3; --g-port:#ffffff;
  --chip:#eef0f3; --badge:#ffffff; --hl:#f4b400;
  font-family: ui-sans-serif, system-ui, "Segoe UI", "DejaVu Sans", Arial, sans-serif;
}
[data-theme=dark]{
  --bg:#111318; --panel:#1a1d24; --ink:#e7e9ee; --muted:#9aa2b1; --line:#2c313b;
  --wire:#8b93a1; --ctrl:#5aa2ff; --clk:#5d6573; --on:#ff7a4d; --onctrl:#6fb0ff;
  --blk:#1d2129; --blkline:#c9ced8;
  --g-DataPath:#1c2a3f; --g-controlblock:#2a2140; --g-core:#173029; --g-cpu:#352617; --g-port:#1d2129;
  --chip:#232833; --badge:#1a1d24; --hl:#f4b400;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{display:grid;grid-template-columns:330px 1fr;grid-template-rows:52px 1fr;height:100vh;overflow:hidden}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap}
header .crumbs{display:flex;gap:4px;align-items:center}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.spacer{flex:1}
#search{width:220px;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 9px;font-size:13px}
#results{position:absolute;top:46px;right:150px;width:300px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.15);display:none;z-index:20}
#results div{padding:7px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
#results div:hover{background:var(--chip)}
#results small{color:var(--muted)}
aside{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 14px 30px}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
aside h2:first-child{margin-top:4px}
#asm{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 9px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
.err{color:#d33;font-size:12px;min-height:16px;margin-top:4px}
.ctx{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12.5px;margin-top:6px}
.ctx label{display:flex;gap:6px;align-items:center}
.ctx select{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:1px 4px;font-size:12px}
#decoded{font:12px ui-monospace,Menlo,monospace;color:var(--muted);margin-top:6px;white-space:pre-wrap;line-height:1.45}
.story{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:7px;padding:6px 8px;cursor:pointer;font-size:13px}
.story:hover{background:var(--chip)}
.story.on{border-color:var(--ink)}
.story small{display:block;color:var(--muted);font-size:11.5px}
.legend{font-size:12.5px;display:grid;gap:5px}
.legend div{display:flex;gap:8px;align-items:center;cursor:default}
.legend .grp{cursor:pointer;border-radius:5px;padding:1px 3px}
.legend .grp:hover{background:var(--chip)}
.sw{width:26px;height:0;border-top:3px solid var(--wire)}
.sw.c{border-top:2px solid var(--ctrl)} .sw.k{border-top:2px dashed var(--clk)}
.sq{width:16px;height:12px;border:1.5px solid var(--blkline);border-radius:3px}
main{position:relative;overflow:hidden;grid-column:2;grid-row:2}
svg#cv{width:100%;height:100%;display:block;cursor:grab;user-select:none}
svg#cv.drag{cursor:grabbing}
#zoom{position:absolute;right:14px;bottom:14px;display:flex;gap:6px}
#caption{position:absolute;left:14px;bottom:14px;max-width:min(640px,calc(100% - 200px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.12);display:none;font-size:13.5px;line-height:1.5}
#caption .t{font-weight:650;margin-bottom:4px;display:flex;gap:10px;align-items:center}
#caption .t span{flex:1}
#caption code{font-size:12.5px}
#card{position:absolute;top:12px;right:12px;width:380px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.15);display:none;font-size:13px;line-height:1.45}
#card .hd{position:sticky;top:0;background:var(--panel);padding:12px 14px 8px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
#card .hd h3{margin:0;font-size:16px;flex:1}
#card .hd .x{cursor:pointer;border:none;background:none;font-size:18px;line-height:1;color:var(--muted)}
#card .bd{padding:10px 14px 14px}
#card .meta{color:var(--muted);font-size:12px;margin-top:2px;font-weight:400}
#card table{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0 10px}
#card td,#card th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left;vertical-align:top}
#card th{color:var(--muted);font-weight:600}
#card td.v{font-family:ui-monospace,Menlo,monospace;color:var(--on)}
#card h4{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
#card a{color:var(--ctrl)}
.chip{display:inline-block;background:var(--chip);border-radius:5px;padding:0 6px;font-size:11.5px;margin-right:4px}
code{font-family:ui-monospace,Menlo,monospace;background:var(--chip);border-radius:4px;padding:0 3px}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12px;padding:4px 8px;border-radius:6px;display:none;white-space:nowrap;z-index:30}

/* diagram */
.frame{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:8 6}
.frame-t{fill:var(--muted);font-size:20px;font-weight:650}
.blk .b{stroke:var(--blkline);stroke-width:2.2}
.blk .t{fill:var(--ink);font-size:17px;font-weight:650;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.blk .e{fill:var(--muted);font-size:11.5px;text-anchor:middle;pointer-events:none}
.blk .p{fill:var(--muted);font-size:11px;pointer-events:none}
.blk .code{fill:var(--muted);font-size:11px;pointer-events:none}
.blk{cursor:pointer}
.blk:hover .b{stroke-width:3.2}
.blk.sel .b{stroke:var(--hl);stroke-width:3.6}
.blk.match .b{stroke:var(--hl);stroke-width:4}
.w path,.w line{fill:none;stroke:var(--wire);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.w.bus path{stroke-width:3}
.w.ctrl path,.w.ctrl line{stroke:var(--ctrl)}
.w.clk path,.w.clk line{stroke:var(--clk);stroke-dasharray:5 4}
.w.konst line{stroke:var(--clk)}
.w.open line{stroke:var(--clk);stroke-dasharray:3 3}
.w .hit{stroke:transparent!important;stroke-width:12!important;stroke-dasharray:none!important;cursor:pointer}
.w circle{fill:var(--wire)} .w.ctrl circle{fill:var(--ctrl)}
.w text{fill:var(--muted);font-size:12px}
.w.ctrl text{fill:var(--ctrl)}
.w.hl path:not(.hit),.w.hl line{stroke:var(--hl)!important;stroke-width:4!important}
.arrow{fill:var(--wire)} .w.ctrl .arrow{fill:var(--ctrl)}
.tracing .w:not(.on),.tracing .w .off{opacity:.16}
.tracing .blk:not(.on){opacity:.38}
.tracing .w.on path:not(.hit),.tracing .w.on line{stroke:var(--on)}
.tracing .w.on.bus path:not(.hit){stroke-width:4}
.tracing .w.on circle,.tracing .w.on .arrow{fill:var(--on)}
.tracing .w.on.ctrl path:not(.hit){stroke:var(--onctrl);stroke-width:2.8}
.tracing .w.on.ctrl circle,.tracing .w.on.ctrl .arrow{fill:var(--onctrl)}
.tracing .blk.on .b{stroke-width:3}
.badge rect{fill:var(--badge);stroke:var(--ctrl);stroke-width:1.2}
.badge text{fill:var(--ctrl);font:600 12px ui-monospace,Menlo,monospace;dominant-baseline:middle}
.badge.off{opacity:.45}
.badge.d rect{stroke:var(--on)} .badge.d text{fill:var(--on)}
body.bare{grid-template-columns:0 1fr;grid-template-rows:0 1fr}
body.bare aside,body.bare header,body.bare #zoom{display:none}
</style>
</head>
<body>
<header>
  <h1>RISC-V single-cycle CPU</h1>
  <div class="crumbs" id="crumbs"></div>
  <div class="spacer"></div>
  <input id="search" placeholder="Search blocks, signals…  ( / )" autocomplete="off">
  <div id="results"></div>
  <button class="btn" id="theme" title="Light / dark (T)">◐</button>
  <button class="btn" id="export" title="Download the current view as SVG">SVG ↓</button>
</header>
<aside>
  <h2>Decode an instruction</h2>
  <input id="asm" placeholder="lw x5, 8(x2)   or   0x00812283" spellcheck="false">
  <div class="err" id="asmErr"></div>
  <div class="ctx">
    <label><input type="checkbox" id="cTaken"> branch taken</label>
    <label><input type="checkbox" id="cIrq"> irq = 1</label>
    <label><input type="checkbox" id="cMie"> mstatus.MIE</label>
    <label><input type="checkbox" id="cMeie"> mie.MEIE</label>
    <label>PC in <select id="cPc"><option value="ram">RAM</option><option value="rom">boot ROM</option><option value="none">unmapped</option></select></label>
    <label>data in <select id="cMem"><option value="ram">RAM</option><option value="rom">boot ROM</option><option value="uart">UART</option><option value="plic">PLIC</option><option value="clint">CLINT</option><option value="gpio">GPIO</option><option value="other">unmapped</option></select></label>
  </div>
  <div id="decoded"></div>
  <div style="margin-top:8px;display:flex;gap:6px"><button class="btn" id="clear">Clear highlight</button></div>
  <h2>Walkthroughs</h2>
  <div id="stories"></div>
  <h2>Legend</h2>
  <div class="legend" id="legend"></div>
  <h2>Keys</h2>
  <div style="font-size:12.5px;color:var(--muted);line-height:1.6">Drag to pan, wheel to zoom, <code>F</code> fit, <code>/</code> search, <code>←</code><code>→</code> walkthrough steps, <code>Esc</code> close. Double-click <b>core</b> to open it. Click a wire to see where it goes.</div>
</aside>
<main>
  <svg id="cv" xmlns="http://www.w3.org/2000/svg"><defs>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs><g id="vp"></g></svg>
  <div id="zoom"><button class="btn" id="zin">+</button><button class="btn" id="zout">−</button><button class="btn" id="zfit">Fit</button></div>
  <div id="caption"></div>
  <div id="card"></div>
  <div id="tip"></div>
</main>

<!-- ================================================================ MODEL
  Source of truth for the drawing. tb_ci_cd/check_docs.js checks it against rtl/*.vhd:
  entity ports, every drawn wire = a real RTL net, every RTL connection drawn.
  Pins: per side, "name" (spread evenly) or "name@offset". Wire paths: start pin or "@x,y" junction,
  then "x:N" / "y:N" moves, then the end pin ("#text" = label at the end). -->
<script type="application/json" id="model">
{
"entities": {
  "cpu": {"file":"rtl/cpu.vhd","ports":[["clk","in",1],["rst","in",1],["Illegal","out",1],["irq","in",1],["RezOUT","out",32]],
    "desc":"Top level: the core, the boot ROM, the unified RAM, the MMIO address decoder and the two muxes that pick where instructions and load data come from.","tests":["cpu_boot_tb","tb_uni/cpu_fib_tb"]},
  "core": {"file":"rtl/core.vhd","ports":[["rst","in",1],["clk","in",1],["irq","in",1],["instr","in",32],["PC","out",32],["Illegal","out",1],["rez","out",32],["OUT_OF_MEMORY_DATA","in",32],["WD","out",32],["WE","out",4]],
    "desc":"The single-cycle core: <b>DataPath</b> + <b>controlblock</b> + <b>WriteBlock</b> / <b>ReadBlock</b>. Fetch goes out on <code>PC</code> / <code>instr</code>, data on <code>rez</code> (address), <code>WD</code>, <code>WE[3:0]</code> and <code>OUT_OF_MEMORY_DATA</code>. Double-click to open.","tests":["core_tb","core_irq_tb"],"drill":"core","deps":{"*":[]}},
  "DataPath": {"file":"rtl/DataPath.vhd","ports":[["clk","in",1],["rst","in",1],["PC_Src","in",2],["ImmSrc","in",3],["instr","in",32],["AluSrcB","in",1],["AluSRCA","in",2],["alu_control","in",4],["RegWrite","in",1],["Zero","out",1],["REZ","out",32],["PC","out",32],["ReadData","in",32],["Result_Src","in",2],["WD","out",32],["JalrReg","in",1],["TRAP","in",1],["CSRwrite","in",1],["CSRop","in",2],["MIE","out",1],["MEIE","out",1],["MRET","in",1],["irq","in",1]],
    "desc":"All 32-bit datapath blocks (blue tint in the core view). <code>WD</code> = RD2, <code>REZ</code> = ALU result, <code>PC</code> = PC register.","tests":["datapath_tb"]},
  "controlblock": {"file":"rtl/controlblock.vhd","ports":[["instr","in",32],["zero","in",1],["Illegal","out",1],["RegWrite","out",1],["ASrc","out",2],["BSrc","out",1],["ImmSrc","out",3],["alu_control","out",4],["PCsrc","out",2],["Result_Src","out",2],["Mem_Write","out",1],["irq","in",1],["MIE","in",1],["MEIE","in",1],["TRAP","out",1],["CSRop","out",2],["CSWrite","out",1],["MRET","out",1],["JalrReg","out",1]],
    "desc":"ControlUnit plus the logic around it (violet tint): the interrupt gate <code>TRAP = irq·MIE·MEIE</code>, the two gates that cancel RegWrite / MemWrite on a trap, and the PCSrc priority logic.","tests":["controlblock_tb"]},
  "ControlUnit": {"file":"rtl/ControlUnit.vhd","ports":[["opcode","in",7],["funct3","in",3],["funct7","in",7],["RegWrite","out",1],["ASrc","out",2],["BSrc","out",1],["Illegal","out",1],["Branch","out",1],["ImmSrc","out",3],["Mem_Write","out",1],["Result_Src","out",2],["alu_control","out",4],["rs1","in",5],["CSRwrite","out",1],["CSRop","out",2],["MRET","out",1],["JalrReg","out",1],["Jump","out",1]],
    "desc":"Combinational decoder. Every output is 0 unless the instruction needs it; an unsupported instruction raises only <code>Illegal</code> and so runs as a no-op. <code>rs1</code> is only used to suppress the CSR write of <code>csrrs</code>/<code>csrrc</code> with <code>rs1 = x0</code>. Type an instruction in the left panel to see its outputs.","tests":["controlunit_tb (all 131 072 opcode/funct3/funct7 combinations)"],
    "enc":[["ImmSrc","000 I, 001 S, 010 B, 011 J, 100 U"],["ASrc","00 RD1, 01 PC, 10 zero"],["BSrc","0 RD2, 1 ImmExt"],["Result_Src","00 ALU, 01 load, 10 PC+4, 11 CSR"],["CSRop","01 write, 10 set, 11 clear"],["alu_control","see alu"]]},
  "WriteBlock": {"file":"rtl/WriteBlock.vhd","ports":[["rd2","in",32],["addr_2_bits","in",2],["Mem_Write","in",1],["funct3","in",3],["WE","out",4],["wD","out",32]],
    "desc":"Store formatting. Byte enables from funct3 and the two low address bits; the byte / half-word of rs2 is copied into every lane of <code>wD</code> so the enabled lane gets it. Misaligned <code>sh</code>/<code>sw</code> → <code>WE = 0000</code> (nothing is written).","tests":["writeblock_tb"],
    "enc":[["sw @00","WE 1111"],["sh @00 / @10","0011 / 1100"],["sb @00..@11","0001, 0010, 0100, 1000"]],
    "deps":{"WE":["Mem_Write","addr_2_bits","funct3"],"wD":["rd2","funct3"]}},
  "ReadBlock": {"file":"rtl/ReadBlock.vhd","ports":[["Memory_Data","in",32],["addr_2_bits","in",2],["funct3","in",3],["ReadData","out",32]],
    "desc":"Load formatting: takes the byte / half / word at the low address bits out of the 32-bit memory word and sign- or zero-extends it by funct3. Misaligned <code>lh</code>/<code>lhu</code>/<code>lw</code> → 0.","tests":["readblock_tb"],
    "enc":[["lb / lbu","byte, sign / zero extended"],["lh / lhu","half at @00 or @10"],["lw","word at @00"]]},
  "pc": {"file":"rtl/pc.vhd","ports":[["clk","in",1],["rst","in",1],["PCNext","in",32],["PC_REG","out",32]],
    "desc":"The PC register. Loads <code>PCNext</code> on every rising edge; synchronous reset to <code>0x0000_1000</code>, the start of the boot ROM.","tests":["small_blocks_tb"],"deps":{"PC_REG":[]}},
  "PCPlus4": {"file":"rtl/PCPlus4.vhd","ports":[["PC","in",32],["PC_O","out",32]],"desc":"PC + 4.","tests":["small_blocks_tb"]},
  "MuxJalr": {"file":"rtl/MuxJalr.vhd","ports":[["PC_NOW","in",32],["RD1","in",32],["JalrReg","in",1],["PCtarget_IN","out",32]],
    "desc":"Base for the jump target: PC for branches and <code>jal</code>, rs1 for <code>jalr</code>.","tests":["small_blocks_tb","datapath_tb","core_tb"],"enc":[["JalrReg = 0","PC"],["JalrReg = 1","RD1 (rs1)"]]},
  "PCTarget": {"file":"rtl/PCTarget.vhd","ports":[["PC","in",32],["offset","in",32],["PCOFFSET","out",32]],"desc":"Jump / branch target = base + ImmExt.","tests":["small_blocks_tb"]},
  "ZeroGen": {"file":"rtl/ZeroGen.vhd","ports":[["INP","in",32],["OUTP","out",32]],"desc":"Clears bit 0 of the target. Required by <code>jalr</code>; branch and <code>jal</code> targets are even anyway.","tests":["small_blocks_tb","datapath_tb"]},
  "Pc_mux": {"file":"rtl/Pc_mux.vhd","ports":[["PCPlus4","in",32],["PCL","in",32],["mtvec_handler_addr","in",32],["mepc_ret_addr","in",32],["S","in",2],["PCOUT","out",32]],
    "desc":"Next PC.","tests":["small_blocks_tb"],"enc":[["00","PC + 4"],["01","branch / jump target"],["10","mtvec (interrupt)"],["11","mepc (mret)"]]},
  "riscvregfile": {"file":"rtl/riscvregfile.vhd","ports":[["clk","in",1],["read_idx_second","in",5],["read_idx_first","in",5],["write_idx","in",5],["read_out_first","out",32],["read_out_second","out",32],["write_en","in",1],["write_In","in",32]],
    "desc":"32 × 32-bit registers. Two asynchronous read ports (rs1, rs2), one write port on the rising edge. Writes to <code>x0</code> are ignored, so it always reads 0.","tests":["riscvregfile_tb"],
    "deps":{"read_out_first":["read_idx_first"],"read_out_second":["read_idx_second"]}},
  "ImmGen": {"file":"rtl/ImmGen.vhd","ports":[["imm","in",32],["imm_src","in",3],["imm_out","out",32]],
    "desc":"Builds the sign-extended immediate from the instruction bits.","tests":["immgen_tb"],"enc":[["000","I: instr[31:20]"],["001","S: instr[31:25], [11:7]"],["010","B: branch offset, bit 0 = 0"],["011","J: jal offset, bit 0 = 0"],["100","U: instr[31:12] << 12"]]},
  "SrcAMux": {"file":"rtl/SrcAMux.vhd","ports":[["SrcA","in",32],["PC","in",32],["S","in",2],["Y","out",32]],
    "desc":"ALU input A.","tests":["small_blocks_tb"],"enc":[["00","RD1 (rs1)"],["01","PC (auipc)"],["10","0 (lui)"]]},
  "alu_mux": {"file":"rtl/alu_mux.vhd","ports":[["rd2","in",32],["imm","in",32],["S","in",1],["muxout","out",32]],
    "desc":"ALU input B.","tests":["small_blocks_tb"],"enc":[["0","RD2 (rs2)"],["1","ImmExt"]]},
  "alu": {"file":"rtl/alu.vhd","ports":[["A_input","in",32],["B_input","in",32],["alu_control","in",4],["res_out","out",32],["Z","out",1]],
    "desc":"32-bit ALU. <code>Z</code> = 1 when the result is 0; the branch decision uses it (sub for beq/bne, slt/sltu for the rest). Shift amount = B[4:0].","tests":["alu_tb"],
    "enc":[["0000","add"],["1000","sub"],["0001","sll"],["0010","slt (signed)"],["0011","sltu"],["0100","xor"],["0101","srl"],["1101","sra"],["0110","or"],["0111","and"]]},
  "CSRblock": {"file":"rtl/CSRblock.vhd","ports":[["clk","in",1],["rst","in",1],["w_DATA","in",32],["mtvec_handler_addr","out",32],["mepc_ret_addr_in","in",32],["mepc_ret_addr_out","out",32],["TRAP","in",1],["CSRwrite","in",1],["CSROp","in",2],["CSRnum","in",12],["irq","in",1],["MIE","out",1],["MEIE","out",1],["MRET","in",1],["CSR_RES","out",32]],
    "desc":"Machine-mode CSRs. <code>CSR_RES</code> is the old value of CSR <code>instr[31:20]</code> (goes to rd). On the clock edge, in priority order: <b>TRAP</b>: mepc ← PC, mcause ← 0x8000_000B, MPIE ← MIE, MIE ← 0. <b>MRET</b>: MIE ← MPIE, MPIE ← 1. <b>CSRwrite</b>: CSR ← rs1 / old | rs1 / old & ~rs1. Unknown CSRs read 0. Everything resets to 0.",
    "tests":["csrblock_tb","core_irq_tb"],
    "enc":[["0x300 mstatus","bit 3 MIE, bit 7 MPIE"],["0x304 mie","bit 11 MEIE"],["0x305 mtvec","handler address"],["0x341 mepc","return address"],["0x342 mcause","0x8000_000B after a trap"],["0x344 mip","bit 11 = irq (read only)"]],

"stories": [
 {"id":"boot","title":"Boot: ROM → RAM","sub":"reset, lui, jalr, first RAM fetch","beats":[
   {"view":"cpu","asm":"lui x5, 0x80000","ctx":{"pc":"rom"},"text":"After reset the PC is <code>0x0000_1000</code>. MMIO sees the PC in the ROM range, so <code>intersel = 00</code> and <b>interselmux</b> passes the boot ROM word to the core."},
   {"view":"core","asm":"lui x5, 0x80000","ctx":{"pc":"rom"},"text":"<code>lui x5, 0x80000</code>: ImmGen builds the U immediate (<code>ImmSrc = 100</code>), SrcA mux feeds 0 (<code>ASrc = 10</code>), ALU adds, x5 ← <code>0x8000_0000</code>."},
   {"view":"core","asm":"jalr x0, 0(x5)","ctx":{"pc":"rom"},"text":"<code>jalr x0, 0(x5)</code>: JALR mux picks RD1 (<code>JalrReg = 1</code>), the adder adds 0, ZeroGen clears bit 0, <code>PCSrc = 01</code>. Next PC = <code>0x8000_0000</code>. rd = x0, so the PC+4 write is dropped by the register file."},
   {"view":"cpu","asm":"addi x10, x0, 20","ctx":{"pc":"ram"},"text":"Now PC ≥ <code>0x8000_0000</code>: <code>intersel = 01</code>, instructions come from the RAM (<code>hex.hex</code>), which also holds the program's data."}]},
 {"id":"r","title":"R-type: add","sub":"add x3, x1, x2","beats":[
   {"view":"core","asm":"add x3, x1, x2","text":"Both register reads go through the muxes (<code>ASrc = 00</code>, <code>BSrc = 0</code>) into the ALU (<code>ALUControl = 0000</code>). <code>ResultSrc = 00</code> writes the ALU result into x3. Next PC = PC + 4."}]},
 {"id":"i","title":"I-type: addi / srai","sub":"immediate as SrcB","beats":[
   {"view":"core","asm":"addi x5, x5, -1","text":"Same as R-type, but SrcB is the I immediate (<code>BSrc = 1</code>, <code>ImmSrc = 000</code>)."},
   {"view":"core","asm":"srai x6, x6, 3","text":"Shifts use the immediate too; funct7 = 0100000 selects arithmetic shift (<code>ALUControl = 1101</code>), shift amount = B[4:0]."}]},
 {"id":"lw","title":"Load: lw / lb","sub":"address, memory, ReadBlock","beats":[
   {"view":"core","asm":"lw x5, 8(x2)","text":"ALU computes rs1 + 8 = the address, which leaves the core on <code>rez</code>. The memory word comes back on <code>OUT_OF_MEMORY_DATA</code>, ReadBlock picks the word (funct3 = 010, address bits [1:0]), <code>ResultSrc = 01</code> writes it to x5."},
   {"view":"cpu","asm":"lw x5, 8(x2)","ctx":{"mem":"ram"},"text":"At the top level MMIO decodes the address: RAM → <code>RDsel = 000</code>, ReadDatamux returns the RAM word."},
   {"view":"cpu","asm":"lw x5, 0(x6)","ctx":{"mem":"rom"},"text":"The same load from the boot ROM range: <code>RDsel = 001</code>. The ROM has its own data port, so code can read constants from it."},
   {"view":"core","asm":"lb x5, 3(x2)","text":"<code>lb</code>: ReadBlock takes byte 3 and sign-extends it. Misaligned <code>lh</code>/<code>lw</code> read 0."}]},
 {"id":"sw","title":"Store: sw / sb","sub":"WriteBlock, byte enables","beats":[
   {"view":"core","asm":"sw x5, 12(x2)","text":"Address = rs1 + S immediate (<code>ImmSrc = 001</code>). RD2 goes to WriteBlock, which sets <code>WE = 1111</code>. No register write."},
   {"view":"cpu","asm":"sw x5, 12(x2)","ctx":{"mem":"ram"},"text":"MMIO passes WE to the RAM only for RAM addresses (<code>WE3M_1</code>); the write happens on the clock edge."},
   {"view":"cpu","asm":"sw x5, 0(x6)","ctx":{"mem":"rom"},"text":"A store to the ROM range: <code>WE3M_1 = 0000</code>, the store is dropped."},
   {"view":"core","asm":"sb x5, 1(x2)","text":"<code>sb</code> at offset 1: the byte is copied into all lanes of wD, <code>WE = 0010</code> picks lane 1."}]},
 {"id":"br","title":"Branch: beq / blt","sub":"Zero flag and PCSrc","beats":[
   {"view":"core","asm":"beq x1, x2, -8","ctx":{"taken":true},"text":"ALU subtracts (<code>ALUControl = 1000</code>), Zero = 1. PCSrc logic: Branch · (Zero ⊕ f3[0] ⊕ f3[2]) = 1 → <code>PCSrc = 01</code>, PC ← PC + B-immediate."},
   {"view":"core","asm":"beq x1, x2, -8","ctx":{"taken":false},"text":"Not taken: Zero = 0 → <code>PCSrc = 00</code>, PC + 4."},
   {"view":"core","asm":"blt x1, x2, 16","ctx":{"taken":true},"text":"<code>blt</code> uses slt (<code>ALUControl = 0010</code>): result 1 → Zero = 0, and funct3[2] = 1 flips the test, so the branch is taken."}]},
 {"id":"j","title":"Jumps: jal / jalr","sub":"PC+4 to rd","beats":[
   {"view":"core","asm":"jal x1, 64","text":"<code>Jump = 1</code> → <code>PCSrc = 01</code>, target = PC + J immediate. <code>ResultSrc = 10</code> saves PC + 4 in x1."},
   {"view":"core","asm":"jalr x0, 0(x1)","text":"<code>ret</code>: JALR mux picks rs1 (<code>JalrReg = 1</code>), target = (x1 + 0) with bit 0 cleared by ZeroGen."}]},
 {"id":"u","title":"U-type: lui / auipc","sub":"SrcA = 0 or PC","beats":[
   {"view":"core","asm":"lui x7, 0x12345","text":"<code>ASrc = 10</code> feeds 0 to the ALU, so rd = U immediate."},
   {"view":"core","asm":"auipc x7, 0x1","text":"<code>ASrc = 01</code> feeds the PC, so rd = PC + (imm << 12)."}]},
 {"id":"csr","title":"CSR access","sub":"csrrw / csrrs","beats":[
   {"view":"core","asm":"csrrw x0, mtvec, x5","text":"<code>csrrw</code>: CSRblock gets rs1 as write data and the CSR number from instr[31:20]; <code>CSRwrite = 1</code>, <code>CSRop = 01</code>. The old value goes to rd via <code>ResultSrc = 11</code> (here rd = x0)."},
   {"view":"core","asm":"csrrs x6, mstatus, x7","text":"<code>csrrs</code>: new value = old | rs1 (<code>CSRop = 10</code>), rd gets the old value."},
   {"view":"core","asm":"csrrs x6, mcause, x0","text":"<code>csrr</code> (= csrrs with rs1 = x0): ControlUnit sees rs1 = 0 and keeps <code>CSRwrite = 0</code>; read only."}]},
 {"id":"irq","title":"Interrupt trap","sub":"irq · MIE · MEIE","beats":[
   {"view":"core","asm":"addi x5, x5, 1","ctx":{"irq":true,"mie":false,"meie":true},"text":"irq = 1 but <code>mstatus.MIE = 0</code>: the AND gate keeps TRAP = 0, the instruction runs normally."},
   {"view":"core","asm":"addi x5, x5, 1","ctx":{"irq":true,"mie":true,"meie":true},"text":"All three are 1 → <b>TRAP</b>. RegWrite and MemWrite are forced to 0 (the instruction is cancelled), <code>PCSrc = 10</code> sends the PC to <code>mtvec</code>, CSRblock saves this PC in mepc, sets mcause = <code>0x8000_000B</code> and clears MIE."},
   {"view":"cpu","asm":"addi x5, x5, 1","ctx":{"irq":true,"mie":true,"meie":true},"text":"At the top level an interrupt is just the <code>irq</code> pin; nothing else changes. There is no way to acknowledge it from software yet, so the source must drop irq before mret."}]},
 {"id":"mret","title":"mret","sub":"back to mepc","beats":[
   {"view":"core","asm":"mret","text":"<code>MRET = 1</code> → <code>PCSrc = 11</code>, PC ← mepc (the cancelled instruction runs again). CSRblock: MIE ← MPIE, MPIE ← 1."}]},
 {"id":"ill","title":"Illegal instruction","sub":"ecall, fence, csrrwi …","beats":[
   {"view":"core","asm":"ecall","text":"Not supported: ControlUnit raises only <code>Illegal</code> (a cpu output). Nothing is written, PC + 4: the instruction is a no-op. There is no illegal-instruction trap."}]}
]
}

// URL hash: #view=core&asm=lw%20x5,8(x2)&ctx=taken,irq,mie,meie,pc:rom,mem:uart&bare
function writeHash() {
  if (writeHash.off) return;
  const p = new URLSearchParams(); p.set('view', view.id);
  if (state) {
    p.set('asm', state.text);
    const c = ctxFromUI(), parts = [];
    for (const k of ['taken', 'irq', 'mie', 'meie']) if (c[k]) parts.push(k);
    if (c.pc !== 'ram') parts.push('pc:' + c.pc); if (c.mem !== 'ram') parts.push('mem:' + c.mem);
    if (parts.length) p.set('ctx', parts.join(','));
  }
  if (document.body.classList.contains('bare')) p.set('bare', '');
  history.replaceState(null, '', '#' + p.toString());
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('bare')) document.body.classList.add('bare');
  if (p.get('theme')) document.documentElement.dataset.theme = p.get('theme');
  const c = {}; for (const t of (p.get('ctx') || '').split(',').filter(Boolean)) { const [k, v] = t.split(':'); c[k] = v === undefined ? true : v; }
  ctxToUI(c);
  $('#asm').value = p.get('asm') || '';
  writeHash.off = true; setView(VIEWS[p.get('view')] ? p.get('view') : 'core'); writeHash.off = false;
  decodeNow();
  const sel = p.get('sel') && view._byId[p.get('sel')];
  if (sel) openBlockCard(view, sel);
  const st = p.get('story') && M.stories.find(x => x.id === p.get('story'));
  if (st) { story = st; beat = Math.max(0, Math.min(st.beats.length - 1, (+p.get('beat') || 1) - 1)); showBeat(); }
}
window.addEventListener('resize', () => fit());
readHash();
})();
