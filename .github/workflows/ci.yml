name: CI

on:
  push:
  pull_request:

jobs:
  simulate:
    runs-on: ubuntu-latest
    container: ghdl/ghdl:ubuntu22-mcode
    steps:
      - uses: actions/checkout@v4

      - name: Install node (docs check)
        run: apt-get update -qq && apt-get install -y -qq nodejs > /dev/null

      - name: Unit testbenches (tb_ci_cd)
        run: ./tb_ci_cd/run.sh

      - name: Fibonacci program on full CPU (tb_uni)
        working-directory: tb_uni
        run: |
          for f in core/control/ControlUnit core/datapath/ImmGen core/datapath/PCPlus4 core/datapath/PCTarget core/datapath/MuxJalr core/datapath/ZeroGen core/datapath/Pc_mux core/datapath/alu core/datapath/alu_mux core/datapath/SrcAMux core/datapath/result_mux core/datapath/pc core/datapath/riscvregfile core/control/controlblock core/datapath/CSRblock core/datapath/DataPath core/WriteBlock core/ReadBlock core/core unifiedmem bootrom MMIO interselmux ReadDatamux cpu; do
            ghdl -a --std=08 ../rtl/$f.vhd
          done
          ghdl -a --std=08 cpu_fib_tb.vhd
          ghdl --elab-run --std=08 cpu_fib_tb --assert-level=error
