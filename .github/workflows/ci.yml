name: CI

on:
  push:
  pull_request:

jobs:
  simulate:
    runs-on: ubuntu-latest
    container: ghdl/ghdl:ubuntu22-mcode
    steps:
      - uses: actions/checkout@v4

      - name: Unit testbenches (tb_ci_cd)
        run: ./tb_ci_cd/run.sh

      - name: Fibonacci program on full CPU (tb_uni)
        working-directory: tb_uni
        run: |
          for f in ControlUnit ImmGen PCPlus4 PCTarget MuxJalr ZeroGen Pc_mux alu alu_mux result_mux pc riscvregfile instruction_memory memory_data controlblock DataPath WriteBlock ReadBlock core cpu; do
            ghdl -a --std=08 ../rtl/$f.vhd
          done
          ghdl -a --std=08 cpu_fib_tb.vhd
          ghdl --elab-run --std=08 cpu_fib_tb --assert-level=error
